augmentation:
  global_img_size: 224
  normalize: from_model
model:
  backbone: mobilevitv2_100
  d_emb: 384
  dropout: 0.1
  gate_init: 0.0
  head_dropout: 0.2
  n_fusion_layers: 1
  n_heads: 8
  num_classes: 7
  pretrained: true
  roi_mode: bilinear
  roi_spatial: 1
paths:
  csv_dir: /mnt/hdd/ajy_25/au_csv
  output_dir: /home/ajy/Jetson_thor/emotion_system/result
  raw_train: /home/ajy/AI_hub_250704/data2/data_processed_korea
  raw_val: /home/ajy/AI_hub_250704/data2/data_processed_korea_validation
  train_csv: /mnt/hdd/ajy_25/au_csv/index_train.csv
  val_csv: /mnt/hdd/ajy_25/au_csv/index_val.csv
preprocess:
  work_short_side: 800
  workers: 12
seed: 42
training:
  amp: true
  backbone_lr_scale: 0.1
  base_lr: 3e-4
  batch_size: 64
  epochs: 200
  focal_gamma: 2.0
  freeze_backbone_epochs: 3
  grad_clip_norm: 5.0
  label_smoothing: 0.0
  loss: focal
  metric: f1_macro
  min_lr: 1e-6
  num_workers: 8
  optimizer: adamw
  save_every: 10
  scheduler: cosine_warmup
  warmup_ratio: 0.05
  weight_decay: 0.05
