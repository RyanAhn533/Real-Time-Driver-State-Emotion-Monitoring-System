# ============================================================
# Jetson Thor DMS - Full Pipeline Configuration
# ============================================================
# 5-Layer Architecture:
#   L1: Input & Preprocessing
#   L2: Expert Layer (FER + A/V)
#   L3: PerClos + Drowsy Head
#   L4: Event Encoder
#   L5: Agent / Gating
# ============================================================

seed: 42

# ── Paths ──
paths:
  fer_checkpoint: /home/ajy/Jetson_thor/emotion_system/result/best.pth
  av_checkpoint_dir: /home/ajy/Jetson_thor/emotion_system/multimodal/checkpoints/ckpt_v3
  av_fold: 1
  agent_checkpoint: null  # Set after Agent training
  output_dir: /home/ajy/Jetson_thor/emotion_system/pipeline_output

# ── FER Expert (Layer 2.1) ──
fer_expert:
  enabled: true
  backbone: mobilevitv2_100
  num_au: 8
  num_classes: 7
  d_emb: 384
  n_heads: 8
  n_fusion_layers: 1
  roi_mode: bilinear
  classes:
    0: angry
    1: anxious
    2: happy
    3: hurt
    4: neutral
    5: sad
    6: surprised

# ── A/V Expert (Layer 2.2) ──
av_expert:
  enabled: false  # Enable when A/V data pipeline is ready
  d_model: 128
  num_classes: 7
  n_mels: 128
  mel_time: 128
  bio_channels: 4
  bio_seq_len: 256
  dropout: 0.2

# ── PerClos & Drowsiness (Layer 3) ──
perclos:
  ear_threshold: 0.21
  window_size: 30  # frames (1 sec at 30fps)
  drowsy_threshold: 0.4
  sleeping_threshold: 0.8
  ear_landmarks:
    left: [362, 385, 387, 263, 373, 380]
    right: [33, 160, 158, 133, 153, 144]

# ── Event Encoder (Layer 4) ──
event_encoder:
  enabled: true
  type: gru         # gru | tcn
  hidden_dim: 128
  n_layers: 1
  dropout: 0.1
  bidirectional: true
  # input_dim is computed dynamically:
  #   FER(7 logits + 2 quality) + AV(7 logits + 4 extras) + PerClos(2) = 22

# ── Agent / Gating (Layer 5) ──
agent:
  enabled: true
  num_classes: 13   # 12 emotions + drowsy
  hidden_dim: 128
  use_av_expert: false  # Match av_expert.enabled
  use_event_encoder: true

# ── Agent Training ──
agent_training:
  epochs: 50
  batch_size: 32
  lr: 1e-3
  weight_decay: 0.01
  scheduler: cosine_warmup
  warmup_ratio: 0.1
  # Loss weights
  w_cls: 1.0
  w_av: 0.5
  w_drowsy: 0.3
  w_smooth: 0.1
  w_consist: 0.1

# ── Runtime ──
runtime:
  fps: 30
  window_size: 30       # frames per event
  window_stride: 15     # overlap (50%)
  device: cuda
  amp: true
  output_format: json   # json | binary

# ── Refined Label Spec (13 classes) ──
refined_labels:
  0: neutral
  1: calm
  2: happy
  3: positive_engaged
  4: excited
  5: sad
  6: depressed
  7: anxious
  8: stressed
  9: angry
  10: hurt
  11: surprised
  12: drowsy
